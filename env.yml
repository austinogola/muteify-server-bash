name: spleeter-server
channels:
  - conda-forge
dependencies:
  - python=3.9
  - ffmpeg
  - tensorflow=2.12
  - pip
  - pip:
      - spleeter
      - flask==2.0.3
      - werkzeug==2.2.3
      - click==7.1.2
      - dotenv
      - flask_cors 
      - gunicorn
      - flask_pymongo==2.3.0 
      - flask_bcrypt 
      - pyjwt
      - pydub
      - wget
      - supabase
      - b2sdk==2.8.1
      - redis
      - ffmpeg-python 
      - "numpy<2"
